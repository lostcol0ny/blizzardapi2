name: PR Agent

# PR-Agent's version, model and settings live in the shared workflow in
# lostcol0ny/pr-agent-workflows; change them there, not here. This file only
# forwards events, because triggers, permissions and secrets cannot be shared.
# The shared workflow decides which of the forwarded events start a review.
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  pr_agent:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: lostcol0ny/pr-agent-workflows/.github/workflows/pr_agent.yml@main
    secrets:
      OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
